<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VI Radio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="radio" class="hidden">
        <div id="carousel">
            <img id="icon-left" class="side-icon" src="icons/On_Demand.png" alt="">
            <div id="viewport">
                <div id="track"></div>
            </div>
            <img id="icon-right" class="side-icon" src="icons/Mute.png" alt="">
        </div>
        <div id="info">
            <div id="info-line"></div>
            <div id="station"></div>
            <div id="title"></div>
            <div id="artist"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
